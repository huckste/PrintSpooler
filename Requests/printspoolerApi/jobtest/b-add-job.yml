name: B add job
method: POST
url: $localhost/PrintJob
timeout: 0
followRedirects: true
maxRedirects: 5
body: |-
  {
    "submittedBy": "noodle",
    "fileName": "test.pdf",
    "rawData": "aGVsbG8=",
    "contentType": "application/pdf",
    "printerId": "$printerId"
  }
body_type: json
capture:
  jobId:
    value: body.id
    persist: environment
assert:
  - expression: status
    operator: equals
    value: 201
  - expression: body.printerId
    operator: equals
    value: $printerId
